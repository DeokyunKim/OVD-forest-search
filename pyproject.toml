[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "undercanopy"
version = "0.1.0"
description = "Open-vocabulary detection of missing persons and belongings under forest canopy"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Only what `utils/` needs: the protocol, the COCO evaluation and the
# fragment format. Every detector is an optional extra, because the four
# architectures need mutually exclusive versions of `transformers` and cannot
# share one environment -- see requirements/README.md.
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pycocotools>=2.0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["utils*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Long runs write shared-memory files under TMPDIR; the root filesystem on the
# machine this was developed on could not hold them. Point TMPDIR at a data
# volume before running anything that touches the full test set.
addopts = "-q"
